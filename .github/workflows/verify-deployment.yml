name: Verify deployment

# Checks the live site from the outside. This catches the failures CI cannot see:
# a site that is not serving, a bundle built with the placeholder API URL, or an
# API that does not list this site in its CORS allowlist.
#
# The API's own checks (database reachability, auth, migrations) live in the
# foodiana-backend repository's workflow of the same name.
#
# Run it after Hostinger finishes deploying. The scheduled run is a light
# heartbeat — a dedicated uptime monitor is better if you need tight alerting.

on:
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Site base URL (defaults to the PRODUCTION_SITE_URL variable)'
        required: false
        type: string
      api_url:
        description: 'API base URL the bundle should point at (defaults to the PRODUCTION_API_URL variable)'
        required: false
        type: string
  schedule:
    # Every 6 hours. Tighten before the event, or delete this block entirely.
    - cron: '0 */6 * * *'

permissions:
  contents: read

jobs:
  verify:
    name: Check the live site
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve targets
        id: targets
        run: |
          SITE_URL="${{ inputs.site_url || vars.PRODUCTION_SITE_URL }}"
          API_URL="${{ inputs.api_url || vars.PRODUCTION_API_URL }}"
          if [ -z "$SITE_URL" ] || [ -z "$API_URL" ]; then
            echo "::error::Both a site URL and an API URL are needed. Set the PRODUCTION_SITE_URL and PRODUCTION_API_URL repository variables (Settings -> Secrets and variables -> Actions -> Variables), or pass them when dispatching."
            exit 1
          fi
          echo "site_url=$SITE_URL" >> "$GITHUB_OUTPUT"
          echo "api_url=$API_URL"   >> "$GITHUB_OUTPUT"

      - name: Verify
        env:
          SITE_URL: ${{ steps.targets.outputs.site_url }}
          API_URL: ${{ steps.targets.outputs.api_url }}
        run: node scripts/verify-deployment.mjs

      - name: Summary
        if: always()
        run: |
          {
            echo "### Deployment verification"
            echo ""
            echo "- Site: \`${{ steps.targets.outputs.site_url }}\`"
            echo "- API:  \`${{ steps.targets.outputs.api_url }}\`"
            echo "- Result: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
