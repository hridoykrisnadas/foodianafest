name: CI

# The frontend is the whole repository now — the API lives in
# https://github.com/hridoykrisnadas/foodiana-backend and has its own pipeline.
#
# Hostinger deploys this site directly from the `backend` branch, so CI runs on
# it. There is no `production` pointer branch in this repository; adding one is
# worthwhile if you want a failing build to be unable to reach the site, but
# today the branch you push is the branch that deploys.

on:
  push:
    branches: [backend, main]
  pull_request:
    branches: [backend, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the supported floor; 22 is what the Hostinger app runs.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Placeholder only. NEXT_PUBLIC_* is inlined at build time, and the real
          # production build happens on Hostinger with the real value.
          NEXT_PUBLIC_API_URL: http://localhost:4000

      # Fails if a Supabase client or database credential reappears in anything
      # shipped to a browser. The browser must reach data only through the API.
      - name: Check the frontend ships no database credentials
        run: node scripts/check-frontend-bundle.mjs

  deploy-simulation:
    name: Hostinger install simulation
    runs-on: ubuntu-latest

    # Hostinger installs production dependencies only, so anything the build
    # needs must be a regular dependency. This job reproduces that install so the
    # mistake fails here instead of on a real deploy.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install without devDependencies, then build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: https://api.example.com
        run: |
          npm ci --omit=dev
          npm run build
          test -d .next || { echo "::error::frontend build produced no .next"; exit 1; }
