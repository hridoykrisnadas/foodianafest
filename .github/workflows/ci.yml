name: CI

# backend/ and frontend/ are independent applications, so they are verified in
# parallel. On green, the `publish` job copies each folder to its own deploy
# branch, where that folder IS the repository root — which is what Hostinger
# needs, since a Hostinger Node.js app expects package.json at the root and has
# no setting for a subdirectory.
#
# Hostinger reads only the deploy-* branches, and only this workflow writes them,
# so a failing build cannot reach production.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 20 is the supported floor; 22 is what the Hostinger app runs.
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Typecheck
        working-directory: backend
        run: npm run typecheck

      - name: Build
        working-directory: backend
        run: npm run build

      # Boots dist/cluster.js exactly as Hostinger will, then asserts 20
      # behaviours that need no database.
      - name: Smoke test
        run: node scripts/smoke-test.mjs
        env:
          SUPABASE_URL: https://ci-placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-placeholder-service-role-key-not-real
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters-long
          ADMIN_PASSWORD: ci-only-admin-password
          AGENT_PASSWORD: ci-only-agent-password
          CORS_ORIGINS: https://ci.example
          CLUSTER_WORKERS: '1'
          LOG_LEVEL: silent

  frontend:
    name: Frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Placeholder only. NEXT_PUBLIC_* is inlined at build time, and the real
          # production build happens on Hostinger with the real value.
          NEXT_PUBLIC_API_URL: http://localhost:4000

      # Fails if a Supabase client or database credential reappears in anything
      # shipped to a browser.
      - name: Check the frontend ships no database credentials
        run: node scripts/check-frontend-bundle.mjs

  promote:
    name: Promote main to production
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Both Hostinger apps deploy from `production`, each pointed at its own
      # directory in this repo. Only this job advances that branch, so a failing
      # build cannot reach production. `production` is a deploy pointer — never
      # commit to it directly.
      - name: Fast-forward production to the verified commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "Promoting ${GITHUB_SHA} to production"
          git push origin "${GITHUB_SHA}:refs/heads/production" --force

      - name: Summary
        run: |
          {
            echo "### Promoted to production"
            echo ""
            echo "Commit \`${GITHUB_SHA}\` passed CI and was pushed to \`production\`."
            echo "Hostinger redeploys both apps from that branch."
            echo ""
            echo "Then run the **Verify deployment** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
